# 生产 Compose。只给服务器使用，不替换本机的 docker-compose.yml。
# 浏览器最终访问宿主机上的反向代理。这里的 frontend 只绑在 loopback，
# 供那一层转发，不长期占用公网 80。backend 和 postgres 没有宿主机端口。

name: jl560-order-demo-prod

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: .
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      SERVER_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: 5s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend

volumes:
  pgdata:
