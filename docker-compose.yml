# 三个容器在同一个 Compose 网络里。服务名就是容器之间的主机名。
# 浏览器在宿主机上，所以它访问的是左边的宿主机端口，不是服务名。
# 本机已有的 PostgreSQL 仍占用宿主机 5432，这里把容器的 5432 映射到 5433。
# backend 走容器网络，连的是 postgres:5432，不要用 .env 里的 localhost。

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: .
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      SERVER_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: 5s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
